name: Test NixOS-Lima Config

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  ubuntu-lima-action:
    # Run the config on ARM Ubuntu with QEMU and Lima.
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        lima-version: ["v2.1.4", "v2.2.1", "v2.3.0"]
      fail-fast: false
    env:
      LIMA_GUEST_NAME: "nixos"
      GUEST_USER: "lima"
      QEMU_SYSTEM_AARCH64: 'qemu-system-aarch64 -machine virt -cpu cortex-a76'
    name: NixOS Lima ${{ matrix.lima-version }} on Ubuntu ARM
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install QEMU
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 qemu-utils
          sudo modprobe kvm
          # Group changes do not take effect in the current GHA session.
          sudo chown $(whoami) /dev/kvm

      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1
        id: lima-actions-setup
        with:
          version: ${{ matrix.lima-version }}
          additional_guestagents: true

      - name: Cache ~/.cache/lima
        uses: actions/cache@v5
        with:
          path: ~/.cache/lima
          key: ubuntu-arm-NixOS-Lima-${{ steps.lima-actions-setup.outputs.version }}

      - name: Start an instance of NixOS
        run: |
          set -eux
          LIMA_USERNET_RESOLVE_IP_ADDRESS_TIMEOUT=5 limactl start --name=${{ env.LIMA_GUEST_NAME }} --set '.user.name = "${{ env.GUEST_USER }}"' nixos.yaml

      - name: Update and Rebuild NixOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          ./setup-nixos.sh ${{ env.LIMA_GUEST_NAME }}

      - name: Initialize Home Manager
        run: |
          set -eux
          ./setup-home-manager.sh ${{ env.LIMA_GUEST_NAME }} ${{ env.GUEST_USER }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifacts-ubuntu-arm-lima-${{ matrix.lima-version }}-errlog
          path: ~/.lima/${{ env.LIMA_GUEST_NAME }}/*.log

  macos-homebrew:
    # Run the config on macOS with Homebrew QEMU and Lima.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26, xcode-27]
      fail-fast: false
    env:
      LIMA_GUEST_NAME: "nixos"
      GUEST_USER: "lima"
      LIMA_VM_TYPE: '--vm-type qemu'
      QEMU_SYSTEM_AARCH64: 'qemu-system-aarch64 -machine virt -cpu max'
    name: NixOS Lima on ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install QEMU and Lima with Homebrew
        run: |
          brew install qemu lima

      - name: Start an instance of NixOS
        run: |
          set -eux
          LIMA_USERNET_RESOLVE_IP_ADDRESS_TIMEOUT=5 limactl start ${{ env.LIMA_VM_TYPE }} --name=${{ env.LIMA_GUEST_NAME }} --set '.user.name = "${{ env.GUEST_USER }}"' nixos.yaml

      - name: Update and Rebuild NixOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          ./setup-nixos.sh ${{ env.LIMA_GUEST_NAME }}

      - name: Initialize Home Manager
        run: |
          set -eux
          ./setup-home-manager.sh ${{ env.LIMA_GUEST_NAME }} ${{ env.GUEST_USER }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: artifacts-os-${{ matrix.os }}-lima-errlog
          path: ~/.lima/${{ env.LIMA_GUEST_NAME }}/*.log
